# 제3회 국민대학교 AI빅데이터 분석 경진대회 — Lead-Lag 기반 산업 시계열 예측 설정

data:
  data_dir: data
  train_file: train.csv
  sample_submission_file: sample_submission.csv
  item_column: item_id
  year_column: year
  month_column: month
  value_column: value
  optional_columns: [weight, quantity]

target:
  forecast_year: 2025
  forecast_month: 8
  validation_months: 3   # 학습 셋의 마지막 N개월을 검증 셋으로 사용

leadlag:
  min_overlap_months: 18
  max_lag: 9
  min_abs_corr: 0.30
  max_pvalue: 0.10
  top_pairs_per_follower: 3
  graph:
    score_threshold: 50.0
    community_resolution: 1.0

features:
  own_lags: [1, 2, 3, 6, 12]
  rolling_windows: [3, 6]
  use_leader_feature: true

model:
  lightgbm:
    objective: regression_l1
    metric: mae
    learning_rate: 0.05
    n_estimators: 2000
    num_leaves: 47
    min_data_in_leaf: 20
    feature_fraction: 0.8
    bagging_fraction: 0.85
    bagging_freq: 1
    reg_alpha: 1.0
    reg_lambda: 5.0
    verbosity: -1
  early_stopping_rounds: 100
  random_state: 42

output:
  artifacts_dir: artifacts
  pairs_path: artifacts/leadlag_pairs.parquet
  forecast_path: artifacts/forecast_2025_08.csv
  submission_path: submissions/submission.csv
  model_path: models/lightgbm.joblib
  log_path: logs/run.log
