[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-lag-forecasting"
version = "0.1.0"
description = "Lead-lag pair discovery and follower forecasting for industrial monthly time series."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-louvain>=0.16",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[project.scripts]
lead-lag-discover = "lead_lag_forecasting.cli:discover_cli"
lead-lag-train = "lead_lag_forecasting.cli:train_cli"
lead-lag-infer = "lead_lag_forecasting.cli:infer_cli"

[tool.setuptools.packages.find]
where = ["src"]
